name: Auto Build
on: 
  push:
    branches: 
      - master
      - dev

jobs:
  auto-build:
    name: Auto Build
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Run the build
      env:
        CI: TRUE 
      run: |
          dotnet nuget add source https://git.crafterbot.com/api/packages/GorillaTagModding/nuget/index.json
          dotnet build ConfigurationManager/ConfigurationManager.csproj

          
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-artifacts
        path: |
          ConfigurationManager.Patcher/bin/Debug/netstandard2.1/ConfigurationManager.Patcher.dll
          ConfigurationManager/bin/Debug/netstandard2.1/ConfigurationManager.dll
